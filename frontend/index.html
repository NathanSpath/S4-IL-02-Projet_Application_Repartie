<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Répartie Nancy</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style/style.css" />
</head>
<body>

    <header>
        <div class="logo">SAE Programation Répartie</div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Carte Interactive</a></li>
                <li><a href="reservation.html">Réservation</a></li>
                <li><a href="CR.html">Compte Rendu</a></li>
            </ul>
        </nav>
    </header>

    <main>
        
        <aside class="sidebar">
            <section class="reservation-section">
                <h2>Réserver une table</h2>
                <form class="booking-form">
                    <label for="nom">Nom :</label>
                    <input type="text" id="nom" placeholder="Votre nom">

                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" placeholder="Votre prénom">

                    <label for="numTel">Numéro de téléphone :</label>
                    <input type="tel" id="numTel" placeholder="06 12 34 56 78", pattern="[0-9]{10}">

                    <label for="table">numéro de table :</label>
                    <input type="text" id="table" placeholder="Numéro de table">

                    <label for="couverts">Couverts :</label>
                    <input type="number" id="couverts" min="1" value="2">

                    <label for="date">Date de réservation :</label>
                    <input type="datetime-local" id="date">

                    <label for="duree">Durée :</label>
                    <input type="number" id="duree" value="2">


                    <button type="submit" class="btn-reserver">Réserver</button>
                </form>
            </section>
            <section class="legende-section">
                <h3>Légende</h3>
                <ul>
                    <li>
                        <span class="dot velib"></span> VélOstan'lib
                        <input type="checkbox" id="velibCheckbox" checked>
                    </li>
                    <li>
                        <span class="dot resto"></span> Restaurants
                        <input type="checkbox" id="restoCheckbox" checked>
                    </li>
                    <li>
                        <span class="dot incident"></span> Travaux & Incidents
                        <input type="checkbox" id="incidentCheckbox" checked>
                    </li>
                </ul>
            </section>
        </aside>

        <section class="map-container">
            <div id="map"></div>
        </section>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
